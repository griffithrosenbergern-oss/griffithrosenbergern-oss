<!DOCTYPE html>
<html>
<head>
  <title>Leaflet PA Cities Map</title>

  <!-- Include Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>
<body>

  <!-- Create the map div -->
  <div id="map" style="width: 800px; height: 500px;"></div>

  <!-- Include Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

  <script>

    // Map center and zoom level
    var map = L.map('map').setView([40.5, -76], 7);

    // Tile layer 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
	subdomains: 'abcd',
	maxZoom: 20
}).addTo(map);

    // City data
    var Lancaster = {
      name: 'Lancaster', //This section and the one below each create a variable for each city with name, lat, lng, and population
      lat:  40.039860,
      lng: -76.304366,
      population: 58039
    }
    
    var Harrisburg = {
      name: 'Harrisburg',  
      lat: 40.273,
      lng: -76.887,
      population: 50099
    };

    // Add circles
       L.circle([Lancaster.lat, Lancaster.lng], {
        radius: Math.sqrt(Lancaster.population)*50, //this makes the radius proportional to the pop of the 
        // city though times 50 instead of divided by ten as this is meters not digits (https://leafletjs.com/reference.html#circle-radius)
        color: 'red',
        fill: true,
        fillColor: 'blue',
        weight: 6
        
        }).bindTooltip ("<b>" + 'Name: ' + "</b>" + "<i>" + Lancaster.name + "</i><br>" + "<b>" + 'Population: ' + "</b>"  + "<i>" + Lancaster.population +"</i>")
      //The above line creates a tooltip bound to the circle with the city name and population,
      //  "<i>" and </i> ends it makes the text that follows italicized (https://leafletjs.com/reference.html#circle-radius)
          .addTo(map);
    
      
      L.circle([Harrisburg.lat, Harrisburg.lng], {
        radius:   Math.sqrt(Harrisburg.population)*50,
        color: 'gold',
        fill: true,
        fillColor: 'blue',
        weight: 6
        
        }).bindTooltip ("<b>" + 'Name: ' + "</b>" + "<i>" + Harrisburg.name + "</i><br>" + "<b>" + 'Population: ' + "</b>"  + "<i>" + Harrisburg.population +"</i>")
      .addTo(map);
    
    
  </script>

</body>
</html>
