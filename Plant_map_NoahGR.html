<!DOCTYPE html>
<html>

<head>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <link href='http://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>

    <style>
        body {
    margin: 0;

    font-family: Lato, sans-serif;

header {
    padding: 1% 5%;

    display: inline-block;

</head>

<body>
    <header>
        <h1>Biomass, Solar and Geothermal Plants in the United States</h1>
        <h2>Symbols proportional to capacity in MW</h2>
    </header>

    <div id='map'></div>

    <footer>
        <p>Map authored by Noah Griffith-Rosenberger</p>
        <p>I used the principles of testing and debugging to have zoom effect symbol size.</p>
        <p>This allows users to more easily zoom in and select small features.</p>
    </footer>

    <script src="power-plants.js"></script>
    <script>

      var map = L.map('map', {
          center: [36,-94],
          zoom: 4,
      });
      
      var tiles = L.tileLayer('http://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="http://cartodb.com/attributions">CartoDB</a>',
          subdomains: 'abcd',
          maxZoom: 19
      });  
      
      tiles.addTo(map);
        
         
    //step 2
      
   plants.features.sort(function(a, b) {
    return b.properties.capacity_mw - a.properties.capacity_mw;
});
    
    //step 1    and then change to step 3 with 'return'
      var Biomass = L.geoJson(plants, {
          pointToLayer: function(feature,latlng) {
              console.log(feature.properties.fuel_source)
              return L.circleMarker(latlng, {
                 color: 'green',
                 weight: 1,
                 fillColor: 'green',
                 fillOpacity: .7,
                 radius: getRadius(feature.properties.capacity_mw) //step4
              });   
          },
          
      filter : function(feature, layer){
              if(feature.properties.fuel_source['Biomass']){
                  return feature
              };
             // console.log(feature);
          },
         
    //step 5
    onEachFeature : function(feature,layer) {
    layer.on('mouseover', function() {
    layer.setStyle({
        fillColor: 'red'
    });
});
layer.on('mouseout', function() {
    layer.setStyle({
        fillColor: 'green'
    });
});


          //step 6  
          
          var name = feature.properties.plant_name
          var capacity = feature.properties.capacity_mw.toLocaleString()
          var fuel = feature.properties.fuel_source
      
                                                
          
          var popup = ("<b>"+name+"</b><br>"
              +capacity+ " MW" + "<br>")
                       layer.bindPopup(popup)
          }
          
          
      }).addTo(map);

    var Geothermal = L.geoJson(plants, {
          pointToLayer: function(feature,latlng) {
              console.log(feature.properties.fuel_source)
              return L.circleMarker(latlng, {
                color: 'blue',
                weight: 1,
                fillColor: 'blue',
                fillOpacity: .7,
                radius: getRadius(feature.properties.capacity_mw) //step4
              });   
          },
          
      filter : function(feature, layer){
              if(feature.properties.fuel_source['Geothermal']){
                  return feature
              };
             // console.log(feature);
          },
         
    //step 5
    onEachFeature : function(feature,layer) {
    layer.on('mouseover', function() {
    layer.setStyle({
        fillColor: 'red'
    });
});
layer.on('mouseout', function() {
    layer.setStyle({
        fillColor: 'blue'
    });
});


          //step 6  
          
          var name = feature.properties.plant_name
          var capacity = feature.properties.capacity_mw.toLocaleString()
          var fuel = feature.properties.fuel_source
      
                                                
          
          var popup = ("<b>"+name+"</b><br>"
              +capacity+ " MW" + "<br>")
                       layer.bindPopup(popup)
          }
          
          
      }).addTo(map);
//Solar
 var Solar = L.geoJson(plants, {
          pointToLayer: function(feature,latlng) {
              console.log(feature.properties.fuel_source)
              return L.circleMarker(latlng, {
                color : 'orange', 
                weight: 1,
                 fillColor: 'orange',
                 fillOpacity: .7,
                 radius: getRadius(feature.properties.capacity_mw) //step4
              });   
          },
          
      filter : function(feature, layer){
              if(feature.properties.fuel_source['Solar']){
                  return feature
              };
             // console.log(feature);
          },
         
    //step 5
    onEachFeature : function(feature,layer) {
    layer.on('mouseover', function() {
    layer.setStyle({
        fillColor: 'red'
    });
});
layer.on('mouseout', function() {
    layer.setStyle({
        fillColor: 'orange'
    });
});


          //step 6  
          
          var name = feature.properties.plant_name
          var capacity = feature.properties.capacity_mw.toLocaleString()
          var fuel = feature.properties.fuel_source
      
                                                
          
          var popup = ("<b>"+name+"</b><br>"
              +capacity+ " MW" + "<br>")
                       layer.bindPopup(popup)
          }
          
          
      }).addTo(map);

//step 4
// Update circle sizes based on zoom level
function updateCircleSizes() {
    var zoom = map.getZoom();
    var zoomFactor = Math.pow(1.3, zoom - 4); // Adjust multiplier based on zoom
    
    Biomass.eachLayer(function(layer) {
        layer.setRadius(getRadius(layer.feature.properties.capacity_mw) * zoomFactor);
    });
    Geothermal.eachLayer(function(layer) {
        layer.setRadius(getRadius(layer.feature.properties.capacity_mw) * zoomFactor);
    });
    Solar.eachLayer(function(layer) {
        layer.setRadius(getRadius(layer.feature.properties.capacity_mw) * zoomFactor);
    });
}

map.on('zoomend', updateCircleSizes);


sourceLayers = {
    "<b style='color: green'>Biomass</b>": Biomass,
    "<b style='color: blue'>Geothermal</b>": Geothermal,
    "<b style='color: orange'>Solar</b>": Solar
}

L.control.layers(null, sourceLayers, {collapsed: false}).addTo(map);

        function getRadius(area){
        var radius = Math.sqrt(area/Math.PI);
        return radius * 1.1;
    }
          
    </script>
    
</body>

</html>
